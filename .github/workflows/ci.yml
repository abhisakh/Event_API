name: From Dev to Prod 4 – CI with GitHub Actions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Test, and Clean
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1. Create the Workflow Skeleton
      # =========================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================================================
      # 2. Build and Run the Docker Image in CI
      # =========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: events-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Containerized API
        # Port 4000 is mapped here based on the project documentation configurations
        run: |
          docker run -d \
            -p 4000:4000 \
            --name events-container \
            events-api:latest

      - name: Wait for API and Check Health
        run: |
          echo "Waiting for API to start..."
          sleep 3
          curl --fail --verbose http://localhost:4000/api/health

      # =========================================================
      # 3. Install Dependencies and Run Tests in CI
      # =========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        # Executes pytest against the running container on port 4000
        run: |
          pytest -v

      # =========================================================
      # 4. Clean Up the Container in CI
      # =========================================================
      - name: Clean up Container
        if: always()
        run: |
          if [ "$(docker ps -aq -f name=events-container)" ]; then
            echo "Stopping and removing container..."
            docker stop events-container
            docker rm events-container
          else
            echo "No container found to clean up."
          fi